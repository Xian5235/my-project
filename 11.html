<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教務諮詢-線上預約詢問系統</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background-color: #f4f6f9; /* 稍微帶點高質感的淡灰藍背景 */
    }
    .form-container {
      max-width: 700px;
      margin: 60px auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      border: 1px solid #e1e5eb;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* 柔和的立體陰影 */
    }
    .form-header {
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .form-label {
      font-weight: 600;
      color: #495057;
    }
    .form-control, .form-select {
      border-radius: 10px;
      padding: 12px 15px;
      border: 1.5px solid #ced4da;
    }
    .form-control:focus, .form-select:focus {
      border-color: #a3bcd4;
      box-shadow: 0 0 0 0.25rem rgba(163, 188, 212, 0.25);
    }
    .btn-submit {
      background: #a3bcd4;
      border: none;
      color: white;
      font-weight: bold;
      padding: 12px;
      border-radius: 10px;
      transition: 0.3s;
      font-size: 1.1rem;
    }
    .btn-submit:hover {
      background: #89a7c4;
      color: white;
    }
    /* 必填欄位的紅色星號 */
    .required::after {
      content: " *";
      color: #dc3545;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg shadow-sm bg-white">
  <div class="container">
    <a class="navbar-brand fw-bold" href="11.html">
      🎓 教務處進修教務組學生查詢系統
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link active" href="11.html">線上預約詢問</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="11-1.html">問題查詢首頁</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="intro.html">FAQ</a>
    </li>
    <li class="nav-item">
      <a class="nav-link text-danger" href="index.html">登出</a>
    </li>
  </ul>
</div>
  </div>
</nav>

<div class="container">
  <div class="form-container">
    
    <div class="form-header text-center">
      <h2 class="fw-bold text-dark">📝 線上諮詢 / 預約詢問單</h2>
      <p class="text-secondary mb-0">請填寫以下資訊，教務處承辦人員將儘速與您聯絡回答。</p>
    </div>

    <form id="appointmentForm" class="needs-validation" novalidate>
      
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="studentId" class="form-label required">學號</label>
          <input type="text" id="studentId" class="form-control" placeholder="請輸入學號" required>
          <div class="invalid-feedback">請輸入正確的學號。</div>
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="studentName" class="form-label required">學生姓名</label>
          <input type="text" id="studentName" class="form-control" placeholder="請輸入姓名" required>
          <div class="invalid-feedback">請輸入姓名。</div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="studentEmail" class="form-label required">電子信箱</label>
          <input type="email" id="studentEmail" class="form-control" placeholder="example@email.com" required>
          <div class="invalid-feedback">請輸入有效的電子信箱。</div>
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="studentPhone" class="form-label required">聯絡電話</label>
          <input type="tel" id="studentPhone" class="form-control" placeholder="請輸入手機號碼" required>
          <div class="invalid-feedback">請輸入聯絡電話。</div>
        </div>
      </div>

      <div class="mb-3">
        <label for="queryCategory" class="form-label required">詢問教務類別</label>
        <select id="queryCategory" class="form-select" required>
          <option value="" selected disabled>-- 請選擇類別 --</option>
          <option value="選課相關">選課相關（加退選、學分上限、暑修）</option>
          <option value="轉系申請">轉系申請（轉系時間、資格、面試）</option>
          <option value="休退復學">休退復學流程諮詢</option>
          <option value="學分抵免">學分抵免審核相關</option>
          <option value="學雜費問題">學雜費、就學貸款</option>
          <option value="畢業相關">畢業資格、證書領取</option>
          <option value="其他教務問題">其他教務問題</option>
        </select>
        <div class="invalid-feedback">請選擇一項教務類別。</div>
      </div>

      <div class="mb-4">
        <label for="queryContent" class="form-label required">詢問詳細內容描述</label>
        <textarea id="queryContent" class="form-control" rows="5" placeholder="請詳細說明您遇到的問題或欲諮詢的內容..." required></textarea>
        <div class="invalid-feedback">請簡述您想詢問的詳細內容。</div>
      </div>

      <button type="submit" class="btn btn-submit w-100 shadow-sm">
        確認無誤，送出預約詢問
      </button>

    </form>
    </div>
</div>

<script>
// 啟用 Bootstrap 5 的前端表單驗證機制
(function () {
  'use strict'
  const form = document.getElementById('appointmentForm')

  form.addEventListener('submit', function (event) {
    // 如果驗證沒通過，阻止表單送出
    if (!form.checkValidity()) {
      event.preventDefault()
      event.stopPropagation()
    } else {
      // 驗證成功後的動作
      event.preventDefault(); // 這裡暫時攔截以便顯示 alert，實務上會送去後端

      const name = document.getElementById('studentName').value;
      const category = document.getElementById('queryCategory').value;

      alert(`謝謝您，${name} 同學！您的「${category}」諮詢表單已成功送出。\n我們將透過 E-mail 或電話與您聯繫。`);
      
      // 留單成功後，可以讓網頁跳轉回問題查詢首頁 11-1.html
      window.location.href = "11-1.html";
    }

    form.classList.add('was-validated')
  }, false)
})()
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
