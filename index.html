<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生登入系統</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 外部CSS -->
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background-color: #f8f9fa; /* 加上淡色背景，襯托白色的登入框 */
    }
    .login-box {
      max-width: 420px;
      margin: 100px auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      border: 1.5px solid #ddd;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* 增加一點點陰影更有質感 */
    }
    .login-title {
      text-align: center;
      margin-bottom: 30px;
      color: #4b4237;
      font-weight: bold;
    }
    .form-label {
      color: #555;
      font-weight: 600;
    }
    .form-control {
      border-radius: 10px;
    }
    .btn-login {
      background: #a3bcd4;
      border: none;
      color: white;
      font-weight: bold;
      padding: 10px;
      border-radius: 10px;
      transition: 0.3s;
    }
    .btn-login:hover {
      background: #89a7c4;
      color: white;
    }
    .error {
      color: #dc3545; /* 使用 Bootstrap 的標準紅 */
      font-size: 14px;
      margin-top: 10px;
      min-height: 21px; /* 固定高度，防止文字出現時畫面「抖動」 */
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg shadow-sm bg-white">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">
      🎓 教務處進修教務組-學生查詢系統
    </a>
  </div>
</nav>

<!-- 登入框 -->
<div class="container">
  <div class="login-box">
    <h2 class="login-title">學生登入</h2>

    <form id="loginForm">
      <!-- 帳號 -->
      <div class="mb-3">
        <label for="user" class="form-label">學號</label>
        <input type="text" id="user" class="form-control" placeholder="請輸入學號" required>
      </div>

      <!-- 密碼 -->
      <div class="mb-3">
        <label for="pwd" class="form-label">密碼</label>
        <input type="password" id="pwd" class="form-control" placeholder="請輸入密碼" required>
      </div>

      <!-- 錯誤訊息提示區 -->
      <p id="msg" class="error"></p>

      <!-- 按鈕 -->
      <button type="submit" class="btn btn-login w-100">登入系統</button>
    </form>
  </div>
</div>

<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const userInput = document.getElementById("user");
const pwdInput = document.getElementById("pwd");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  // 每次重置樣式與訊息
  msg.innerText = "";
  userInput.classList.remove("is-invalid");
  pwdInput.classList.remove("is-invalid");

  const user = userInput.value.trim();
  const pwd = pwdInput.value.trim();

  // 1. 檢查空白
  if (user === "" || pwd === "") {
    msg.innerText = "帳號與密碼不可空白";
    if (user === "") userInput.classList.add("is-invalid");
    if (pwd === "") pwdInput.classList.add("is-invalid");
    return; // 直接中斷，不往下執行
  }

  // 2. 檢查長度
  if (pwd.length < 6) {
    msg.innerText = "密碼至少6碼";
    pwdInput.classList.add("is-invalid");
    pwdInput.focus(); // 幫使用者自動聚焦到密碼欄位
    return;
  }

  // 3. 驗證通過
  alert("登入成功！");
  window.location.href = "11-1.html";
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
